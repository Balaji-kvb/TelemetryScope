apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-demo
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-demo
  template:
    metadata:
      labels:
        app: telemetryscope-demo
    spec:
      containers:
        - name: demo
          image: 667747481883.dkr.ecr.ap-south-1.amazonaws.com/telemetryscope/demo:93ad5a0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INGESTION_URL
              value: http://telemetryscope-ingestion:8001/api/v1/logs
            - name: INGESTION_SERVICE_URL
              value: http://telemetryscope-ingestion:8001
            - name: TELEMETRYSCOPE_ENV
              value: staging
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-demo
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
