apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-ingestion
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-ingestion
  template:
    metadata:
      labels:
        app: telemetryscope-ingestion
    spec:
      containers:
        - name: ingestion
          image: 667747481883.dkr.ecr.ap-south-1.amazonaws.com/telemetryscope/ingestion:93ad5a0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PROCESSING_SERVICE_URL
              value: http://telemetryscope-processing:8002
            - name: TELEMETRYSCOPE_ENV
              value: staging
            - name: TELEMETRYSCOPE_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-ingestion
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-ingestion
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-processing
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-processing
  template:
    metadata:
      labels:
        app: telemetryscope-processing
    spec:
      containers:
        - name: processing
          image: 667747481883.dkr.ecr.ap-south-1.amazonaws.com/telemetryscope/processing:93ad5a0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetryscope-db-credentials
                  key: WRITER_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://telemetryscope_writer:$(WRITER_PASSWORD)@telemetryscope-postgres-recovery:5432/telemetryscope"
            - name: TELEMETRYSCOPE_ENV
              value: staging
            - name: TELEMETRYSCOPE_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-processing
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-processing
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
---
