apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telemetryscope-postgres-recovery-pvc
  namespace: telemetryscope
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-postgres-recovery
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-postgres-recovery
  template:
    metadata:
      labels:
        app: telemetryscope-postgres-recovery
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: telemetryscope
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: telemetryscope-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetryscope-db-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U telemetryscope_admin -d telemetryscope
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U telemetryscope_admin -d telemetryscope
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: telemetryscope-postgres-recovery-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-postgres-recovery
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-postgres-recovery
  ports:
    - port: 5432
      targetPort: 5432
