apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-frontend
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-frontend
  template:
    metadata:
      labels:
        app: telemetryscope-frontend
    spec:
      containers:
        - name: frontend
          image: 667747481883.dkr.ecr.ap-south-1.amazonaws.com/telemetryscope/frontend:93ad5a0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-frontend
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
