apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-frontend
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-frontend
  template:
    metadata:
      labels:
        app: telemetryscope-frontend
    spec:
      containers:
        - name: frontend
          image: telemetryscope-telemetryscope-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-frontend
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
