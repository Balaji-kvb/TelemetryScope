apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-postgres
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-postgres
  template:
    metadata:
      labels:
        app: telemetryscope-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: telemetryscope            
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: telemetryscope-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetryscope-db-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U telemetryscope_admin -d telemetryscope
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U telemetryscope_admin -d telemetryscope
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-postgres
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
