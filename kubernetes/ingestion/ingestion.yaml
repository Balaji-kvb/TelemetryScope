apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-ingestion
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-ingestion
  template:
    metadata:
      labels:
        app: telemetryscope-ingestion
    spec:
      containers:
        - name: ingestion
          image: telemetryscope-telemetryscope-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PROCESSING_SERVICE_URL
              value: http://telemetryscope-processing:8002
            - name: TELEMETRYSCOPE_ENV
              value: development
            - name: TELEMETRYSCOPE_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-ingestion
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-ingestion
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
