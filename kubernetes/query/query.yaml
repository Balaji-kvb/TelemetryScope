apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-query
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-query
  template:
    metadata:
      labels:
        app: telemetryscope-query
    spec:
      containers:
        - name: query
          image: telemetryscope-telemetryscope-query:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetryscope-db-credentials
                  key: READER_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://telemetryscope_reader:$(READER_PASSWORD)@telemetryscope-postgres-recovery:5432/telemetryscope"
            - name: DEMO_API_URL
              value: http://telemetryscope-demo:8080
            - name: TELEMETRYSCOPE_ENV
              value: development
            - name: TELEMETRYSCOPE_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-query
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-query
  ports:
    - name: http
      port: 8003
      targetPort: 8003
  type: ClusterIP
