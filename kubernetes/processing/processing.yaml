apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-processing
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-processing
  template:
    metadata:
      labels:
        app: telemetryscope-processing
    spec:
      containers:
        - name: processing
          image: telemetryscope-telemetryscope-processing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetryscope-db-credentials
                  key: WRITER_PASSWORD            
            - name: DATABASE_URL
              value: "postgresql://telemetryscope_writer:$(WRITER_PASSWORD)@telemetryscope-postgres-recovery:5432/telemetryscope"
            - name: TELEMETRYSCOPE_ENV
              value: development
            - name: TELEMETRYSCOPE_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-processing
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-processing
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
