apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryscope-demo
  namespace: telemetryscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetryscope-demo
  template:
    metadata:
      labels:
        app: telemetryscope-demo
    spec:
      containers:
        - name: demo
          image: telemetryscope-telemetryscope-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INGESTION_URL
              value: http://telemetryscope-ingestion:8001/api/v1/logs
            - name: TELEMETRYSCOPE_ENV
              value: development
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryscope-demo
  namespace: telemetryscope
spec:
  selector:
    app: telemetryscope-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
