name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Application
        working-directory: frontend
        run: npm run build

  backend-checks:
    name: Backend Syntax & Dependencies
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service:
          - services/ingestion-service
          - services/processing-service
          - services/query-service
          - demo-workload
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check
        working-directory: ${{ matrix.service }}
        run: |
          python -m compileall -q .

  docker-validation:
    name: Dockerfile Syntax & Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component:
          - frontend
          - services/ingestion-service
          - services/processing-service
          - services/query-service
          - demo-workload
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        # Build without pushing just to validate the Dockerfile steps succeed
        run: docker build -t test-${{ strategy.job-index }} -f ${{ matrix.component }}/Dockerfile ${{ matrix.component }}
